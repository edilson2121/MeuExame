# Redis Configuration for MeuExame

# Redes
bind 0.0.0.0
protected-mode no
port 6379

# Persistência
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memória
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Performance
timeout 300
tcp-keepalive 300
