name: Deploy

on:
  push:
    branches: [main, master, DOCKER]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '15'

jobs:
  # Job para verificar código
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meuexame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      # Frontend Lint
      - name: Frontend - Install Dependencies
        run: cd frontend && npm ci
        
      - name: Frontend - Run ESLint
        run: cd frontend && npx eslint src/
        
      - name: Frontend - Type Check
        run: cd frontend && npx tsc --noEmit
      
      # Backend Lint
      - name: Backend - Install Dependencies
        run: cd backend && npm ci
        
      - name: Backend - Type Check
        run: cd backend && npx tsc --noEmit

  # Job para testes
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meuexame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Backend - Install Dependencies
        run: cd backend && npm ci
        
      - name: Backend - Generate Prisma Client
        run: cd backend && npx prisma generate
        
      - name: Backend - Run Tests
        run: cd backend && npm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/meuexame_test
          JWT_SECRET: test-secret-key-for-ci

  # Job para build Docker
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/DOCKER')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # Build Backend
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: meuexame/backend:latest,meuexame/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Build Frontend
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: meuexame/frontend:latest,meuexame/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job para deploy em produção
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /app/meuexame
            git pull origin main
            docker-compose pull
            docker-compose up -d --build
            docker-compose exec -T backend npx prisma migrate deploy || true
            docker-compose exec -T backend npx prisma db push || true
            docker system prune -f

  # Notificação de sucesso/falha
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: always()
    
    steps:
      - name: Send Notification
        if: needs.lint.result == 'failure' || needs.test.result == 'failure'
        run: |
          echo "Build failed! Check the logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
