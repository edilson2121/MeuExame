services:
  postgres:
    image: postgres:15-alpine
    container_name: meuexame-postgres
    environment:
      POSTGRES_USER: meuexame
      POSTGRES_PASSWORD: meuexame123
      POSTGRES_DB: meuexame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuexame -d meuexame"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - meuexame-network

  redis:
    image: redis:7-alpine
    container_name: meuexame-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meuexame-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meuexame-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://meuexame:meuexame123@postgres:5432/meuexame?schema=public
      JWT_SECRET: seu-secret-key-muito-seguro
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meuexame-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meuexame-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001/api
    depends_on:
      - backend
    networks:
      - meuexame-network

networks:
  meuexame-network:
    driver: bridge

volumes:
  postgres_data: