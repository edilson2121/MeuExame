services:
  postgres:
    image: postgres:15-alpine
    container_name: meuexame-postgres
    environment:
      POSTGRES_USER: meuexame
      POSTGRES_PASSWORD: meuexame123
      POSTGRES_DB: meuexame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meuexame-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meuexame-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://meuexame:meuexame123@postgres:5432/meuexame?schema=public
      JWT_SECRET: meuexame-super-secret-key-2024
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - postgres
    networks:
      - meuexame-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meuexame-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - meuexame-network

networks:
  meuexame-network:
    driver: bridge

volumes:
  postgres_data: