version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meuexame-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meuexame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meuexame-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: meuexame-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meuexame-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  meuexame-network:
    driver: bridge